<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Stage</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e9edf1;font:13px/1.3 ui-rounded,system-ui,-apple-system,sans-serif;color:#26221d;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;outline:none}
#stage:active{cursor:grabbing}
#hud{position:fixed;inset:0;pointer-events:none}
.pill{position:absolute;display:flex;align-items:center;gap:8px;padding:6px 11px;border-radius:999px;background:rgba(252,250,244,.88);box-shadow:0 1px 0 rgba(38,34,29,.08),0 4px 14px rgba(38,34,29,.12);backdrop-filter:blur(6px)}
#status{left:12px;top:12px}
.dot{width:9px;height:9px;border-radius:50%;background:#e0a526;box-shadow:0 0 0 3px rgba(224,165,38,.2)}
#hud[data-link=live] .dot{background:#22a35a;box-shadow:0 0 0 3px rgba(34,163,90,.2)}
#hud[data-link=stopped] .dot{background:#d1453b;box-shadow:0 0 0 3px rgba(209,69,59,.2)}
#people:not(:empty){padding-left:8px;border-left:1px solid rgba(38,34,29,.15);color:#6b645a}
#fps{right:12px;top:12px;font-variant-numeric:tabular-nums}
#hint{left:50%;bottom:14px;transform:translateX(-50%);white-space:nowrap;transition:opacity .8s}
#hint.quiet{opacity:.45}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="stage" tabindex="0"></canvas>
<div id="hud" data-link="connecting">
<div class="pill" id="status"><span class="dot"></span><span id="status-text">Connecting</span><span id="people"></span></div>
<div class="pill" id="fps" hidden></div>
<div class="pill" id="hint">Click, then WASD to walk &middot; drag to look</div>
</div>
<script id="boot" type="application/json">__BOOT__</script>
<script>__SCRIPT__</script>
</body>
</html>
